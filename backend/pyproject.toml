[project]
name = "inbox-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for Inbox Copilot: Google sign-in, Gmail/Calendar read access, Claude chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.59.0",
    "google-auth-oauthlib>=1.5.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib
    "T20",      # no print()
    "ERA",      # commented-out code
    "ASYNC",    # async pitfalls (blocking calls in async def)
    "FAST",     # FastAPI-specific rules
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"app/scripts/**" = ["T20"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. in argument defaults are intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
packages = ["app"]

[[tool.mypy.overrides]]
# Google's client libraries ship without type information.
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
